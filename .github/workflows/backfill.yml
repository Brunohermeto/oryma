# Reconstrucao/reprocessamento de um periodo (scripts/backfill.py).
# Disparo manual: GitHub → Actions → "Oryma — backfill de periodo" → Run workflow.
name: Oryma — backfill de periodo

on:
  workflow_dispatch:
    inputs:
      from:
        description: "Data inicial (YYYY-MM-DD)"
        default: "2026-01-01"
        required: true
      to:
        description: "Data final (YYYY-MM-DD, vazio = hoje)"
        required: false
      steps:
        description: "Etapas (vendas,bling,ml,amazon,shopee,magalu,estoque,relink,audit)"
        default: "vendas,bling,ml,amazon,shopee,magalu,estoque,relink,audit"
        required: true
      channels:
        description: "Canais da etapa vendas (mercado_livre,shopee,amazon,magalu)"
        default: "mercado_livre,shopee,amazon,magalu"
        required: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backfill
        env:
          APP_PASSWORD: ${{ secrets.ORYMA_APP_PASSWORD }}
          # inputs via env (nunca interpolar ${{ }} direto no shell)
          IN_FROM: ${{ github.event.inputs.from }}
          IN_TO: ${{ github.event.inputs.to }}
          IN_STEPS: ${{ github.event.inputs.steps }}
          IN_CHANNELS: ${{ github.event.inputs.channels }}
        run: |
          for v in "$IN_FROM" "$IN_TO"; do [[ -z "$v" || "$v" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "data invalida: $v"; exit 1; }; done
          for v in "$IN_STEPS" "$IN_CHANNELS"; do [[ -z "$v" || "$v" =~ ^[a-z_,]+$ ]] || { echo "lista invalida: $v"; exit 1; }; done
          python scripts/backfill.py --from "$IN_FROM" ${IN_TO:+--to "$IN_TO"} --steps "$IN_STEPS" ${IN_CHANNELS:+--channels "$IN_CHANNELS"}
